<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Employee Registration</title>
</head>

<body>

<center>

    <h1>
        <b><u>Employee Registration Form</u></b>
    </h1>

    <form action="aes" method="post">

        Employee Id:
        <input type="text" name="eId">
        <br><br>

        Employee FirstName:
        <input type="text" name="eFname">
        <br><br>

        Employee LastName:
        <input type="text" name="eLname">
        <br><br>

        Employee Salary:
        <input type="text" name="eSal">
        <br><br>

        Employee Address:
        <input type="text" name="eAddr">
        <br><br>

        <input type="submit" value="Insert Employee Data">

    </form>

</center>

</body>
</html>
